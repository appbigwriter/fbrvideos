services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fbr
      POSTGRES_USER: fbr
      POSTGRES_PASSWORD: fbr_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fbr_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbr -d fbr"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  fbr_postgres:
