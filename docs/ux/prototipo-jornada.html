width:100%;padding:.6rem;background:#fff;border:1px solid #888;border-radius:3px;margin-top:.3rem}textarea{min-height:110px}select#scenario{width:auto;max-width:100%}dl{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin:1rem 0}dt{color:#555}dd{margin:0;text-align:right;font-weight:600}.preview{min-height:180px;background:repeating-linear-gradient(45deg,#f0f0ee,#f0f0ee 8px,#e8e8e5 8px,#e8e8e5 16px);border:2px dashed #888;display:grid;place-content:center;text-align:center;padding:1rem}.preview p{margin:.4rem}.steps{display:flex;gap:.6rem;flex-wrap:wrap;padding:0;list-style:none}.steps li{padding:.4rem .7rem;border:1px solid #ccc}.steps li.current{background:#ddd;font-weight:bold}details{margin:1rem 0;border:1px solid #ccc;padding:.8rem;background:#fff}summary{cursor:pointer}.check{display:flex;gap:.6rem;align-items:flex-start;margin:1rem 0;font-weight:400}.check input{margin-top:.3rem}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:.6rem;text-align:left;border-bottom:1px solid #ccc}#notice{min-height:1.5rem;margin:0;padding:.5rem 1.3rem;background:#fff}footer{font-size:.85rem;margin-top:2rem;color:#555}.crumb{margin-bottom:1rem}.small{font-size:.85rem}.scene{border:1px dashed #999;padding:.8rem;margin:.65rem 0}@media(max-width:700px){.layout{display:block}aside{border-right:0;border-bottom:1px solid #ccc;padding:1rem}nav{display:flex;flex-wrap:wrap;margin-top:.5rem;gap:.2rem}nav a{font-size:.9rem;padding:.5rem}main{padding:1rem}.grid{grid-template-columns:1fr}.demo{padding:1rem}dl{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}h1{font-size:1.5rem}}

<header class="demo"><p><strong>Protótipo UX · simulação local</strong> — dados, valores e decisões fictícios. Nenhum serviço conectado ou vídeo gerado.</p><div class="demo-controls"><label for="scenario">Explorar cenário</label><select id="scenario"></select><button id="reset">Reiniciar cenário</button><span class="small">Recarregar descarta alterações.</span></div></header>
<p id="notice" role="status" aria-live="polite"></p>
<div class="layout"><aside><strong>FBR Videos</strong><div class="small muted">Artigos em vídeos narrados</div><nav aria-label="Principal" id="nav"></nav></aside><main id="content" tabindex="-1"></main></div>
<script id="fixture" type="application/json">
{"fixture_only":true,"version":"ux-0.1","notice":"Cenários fictícios de apresentação. Sem geração, custos ou aprovação reais.","article":{"ref":{"id":"artigo-demo-01","version":1},"title":"Uma pausa nas notificações — exemplo fictício","author":"Autora fictícia","source":"Texto de demonstração, sem URL externa","text":"Neste exemplo editorial fictício, observo como as notificações interrompem minha atenção. Escolho um momento para fazer uma pausa e retomar uma tarefa de cada vez."},"profile":{"ref":{"id":"perfil-demo-01","version":1},"name":"Reflexão editorial — exemplo fictício","character":"Personagem fictícia","language":"Português","format":"Formato ilustrativo a validar no piloto","calibration_only":false,"notice":"Perfil representado como validado somente neste cenário de UX; sem evidência audiovisual real."},"costs":{"currency":"BRL","estimated_minor":null,"committed_minor":0,"confirmed_minor":0,"ceiling_minor":5000,"safety_margin_minor":500},"scenarios":[{"id":"sucesso","label":"Jornada principal","route":"artigos","state":"preparing","eligibility":{"allowed":true,"calibration_only":false,"blockers":[]}},{"id":"origem-incompleta","label":"Origem incompleta","route":"artigo","state":"preparing","eligibility":{"allowed":false,"calibration_only":false,"blockers":[{"code":"source_incomplete","message":"O corpo do artigo está incompleto. Corrija a captura antes de gerar.","next_action":"Corrigir extração","required":true}]}},{"id":"falha","label":"Falha de montagem","route":"producao","state":"failed","eligibility":{"allowed":true,"calibration_only":false,"blockers":[]},"issue":"A montagem falhou neste exemplo. Componentes válidos e custos foram preservados; repetir somente a montagem."},{"id":"limite","label":"Limite de custo","route":"producao","state":"awaiting_decision","eligibility":{"allowed":true,"calibration_only":false,"blockers":[]},"costs":{"currency":"BRL","estimated_minor":null,"committed_minor":500,"confirmed_minor":4500,"ceiling_minor":5000,"safety_margin_minor":500},"issue":"Nenhum novo job pago será iniciado. O limite não permite a próxima etapa."},{"id":"correcao","label":"Correção localizada","route":"revisao","state":"ready_for_review","eligibility":{"allowed":true,"calibration_only":false,"blockers":[]},"render_ref":{"id":"render-demo-01","version":1},"approval":null,"correction":{"proposal_id":"proposta-demo-01","estimated_minor":700,"target_scene_id":"plano-demo-02","affected":["imagem","clipe","montagem"],"preserved":["roteiro","áudio","legendas"]}}]}

<script>
'use strict';
const F=JSON.parse(document.getElementById('fixture').textContent);
const navItems=[['inicio','Início'],['artigos','Artigos'],['producoes','Produções'],['perfis','Perfis de produção'],['universo','Universo'],['configuracoes','Configurações']];
const labels={preparing:'Em preparação',producing:'Em produção',awaiting_decision:'Aguardando decisão',paused:'Pausada',failed:'Falhou',ready_for_review:'Pronta para revisão',correcting:'Em correção',approved:'Aprovada',exported:'Exportada',cancelled:'Cancelada'};
const routes=['inicio','artigos','artigo','criar','producoes','producao','revisao','correcao','entrega','perfis','universo','configuracoes'];
let S;
const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>v==null?'Não disponível':new Intl.NumberFormat('pt-BR',{style:'currency',currency:S.costs.currency}).format(v/100);
const link=(route,text,primary=false)=>`<a class="button ${primary?'primary':''}" href="#${route}">${text}</a>`;
const button=(id,text,disabled=false,primary=false)=>`<button data-action="${id}" ${disabled?'disabled':''} class="${primary?'primary':''}">${text}</button>`;
const head=(title,desc)=>`<p class="eyebrow">DESENHO DE EXPERIÊNCIA · S0-A01</p><h1>${title}</h1><p>${desc}</p>`;
const source=()=>`<p><strong>${escapeHtml(F.article.title)}</strong></p><p class="small">Artigo ${F.article.ref.id} · revisão ${S.created&&['producoes','producao','revisao','correcao','entrega'].includes(location.hash.slice(1))?(S.productionArticleVersion||1):S.articleVersion} · ${F.article.author}</p>`;
const costs=()=>`<section class="card"><h2>Consumo · valores fictícios em ${S.costs.currency}</h2><dl><dt>Estimado</dt><dd>${money(S.costs.estimated_minor)}</dd><dt>Comprometido, ainda pendente</dt><dd>${money(S.costs.committed_minor)}</dd><dt>Confirmado</dt><dd>${money(S.costs.confirmed_minor)}</dd><dt>Teto da produção</dt><dd>${money(S.costs.ceiling_minor)}</dd><dt>Margem de segurança</dt><dd>${money(S.costs.safety_margin_minor)}</dd></dl><p class="small">Teto não é preço garantido. Disponibilidade de executar será recebida do domínio; valores deste desenho não são cotações.</p></section>`;
function announce(text){document.getElementById('notice').textContent=text;}
function go(route){if(location.hash==='#'+route)render();else location.hash=route;}
function reset(id){const c=F.scenarios.find(x=>x.id===id)||F.scenarios[0];S={scenario:c.id,state:c.state,incomplete:!c.eligibility.allowed,articleVersion:1,sourceText:F.article.text,renderVersion:1,approvalVersion:null,created:c.route==='producao'||c.route==='revisao',costs:{...(c.costs||F.costs)},issue:c.issue||'',pendingCorrection:false,correctionDone:false,cancelledFrom:null};document.getElementById('scenario').value=c.id;announce('Cenário reiniciado. Todas as ações são fictícias.');go(c.route);}
function status(){return `<span class="badge">${labels[S.state]}</span>`;}
function render(){const raw=location.hash.slice(1);const route=routes.includes(raw)?raw:'inicio';const section=['artigo','criar'].includes(route)?'artigos':['producao','revisao','correcao','entrega'].includes(route)?'producoes':route;document.getElementById('nav').innerHTML=navItems.map(([r,l])=>`<a href="#${r}" ${section===r?'aria-current="page"':''}>${l}</a>`).join('');let html='';
if(route==='inicio')html=head('Início','Selecione um artigo ou retome uma produção que precisa de atenção.')+`<div class="grid"><section class="card"><h2>Começar uma produção</h2><p>Artigo + perfil. O sistema planeja as cenas internamente.</p>${link('artigos','Criar vídeo de um artigo',true)}</section><section class="card"><h2>Precisa de atenção</h2>${S.created?status()+`<p>Produção de demonstração.</p>${link('producao','Abrir produção')}`:'<p>Nenhuma produção neste cenário. Configuração e calibração reais ainda não estão conectadas.</p>'}</section></div>`;
if(route==='artigos')html=head('Artigos','A matéria-prima da produção. Confira a origem antes de gerar.')+`<section class="card"><h2>Artigo disponível no cenário</h2>${source()}<p>${S.incomplete?'Captura incompleta — geração bloqueada':'Fonte disponível nesta fixture'} · personagem fictícia associada</p><p class="small">Produções vinculadas: ${S.created?'1 produção fictícia':'nenhuma'}. Ter vídeo não impede outra produção.</p><div class="actions">${link('artigo','Abrir artigo')}${link('criar','Criar vídeo',true)}</div></section><p class="muted">Importar URL e colar texto serão implementados em S1. Sincronização de CMS não é oferecida nesta etapa.</p>`;
if(route==='artigo')html=head('Detalhe do artigo','A revisão da fonte fica fixada em cada produção.')+source()+`<p class="small">${F.article.source}</p>`+(S.incomplete?`<div class="alert"><strong>Fonte incompleta</strong><p>${F.scenarios[1].eligibility.blockers[0].message}</p></div><section class="card"><h2>Corrigir extração</h2><label for="sourceText">Texto completo de demonstração</label><textarea id="sourceText">${escapeHtml(S.sourceText)}</textarea><p class="small">Salvar cria revisão nova da fixture. Nenhuma captura real será alterada.</p>${button('save-source','Simular salvamento de nova revisão',false,true)}</section>`:`<section class="card"><h2>Conteúdo capturado</h2><p>${escapeHtml(S.sourceText)}</p></section>`)+`<div class="actions">${button('create','Criar vídeo',S.incomplete,true)}${link('artigos','Voltar a Artigos')}</div>`;
if(route==='criar')html=head('Criar produção','Escolha artigo e perfil. Você não precisa definir cenas.')+`<div class="grid"><section class="card"><h2>Origem</h2>${source()}${link('artigo','Conferir fonte')}</section><section class="card"><h2>Perfil de produção</h2><label for="profile">Perfil</label><select id="profile"><option>${F.profile.name}</option></select><p>${F.profile.character} · ${F.profile.language}</p><p>${F.profile.format}</p><p class="small">${F.profile.notice}</p></section></div><section class="card"><label for="productionName">Nome da produção</label><input id="productionName" value="Pausa nas notificações — demonstração"><p class="small">Identificação local neste protótipo.</p></section>${costs()}<details><summary>Opções avançadas · opcionais</summary><p>Recorte editorial, duração, ambiente preferido, elementos a evitar e revisão prévia de roteiro. Esses ajustes serão ligados aos contratos em S2.</p><p>Nenhum enquadramento, pose ou plano individual obrigatório.</p></details>`+(S.incomplete?'<div class="alert">Fonte incompleta. Corrija a captura antes de gerar.</div>':S.scenario==='limite'?'<div class="alert">Limite sem margem para gerar neste cenário. Nenhum novo gasto autorizado.</div>':'')+`<div class="actions">${button('generate','Gerar vídeo · simulação',S.incomplete||S.scenario==='limite',true)}${link('artigo','Voltar ao artigo')}</div>`;
if(route==='producoes')html=head('Produções','Vídeos em processamento, revisão e entrega.')+(S.created?`<section class="card">${source()}${status()}<div class="actions">${link('producao','Abrir acompanhamento',true)}</div></section>`:`<section class="card"><h2>Nenhuma produção neste cenário</h2><p>Comece por um artigo.</p>${link('artigos','Selecionar artigo',true)}</section>`);
if(route==='producao'){let next='';if(S.state==='failed')next=`<div class="alert"><strong>Falha conhecida na montagem</strong><p>${S.issue}</p>${button('retry','Simular nova tentativa de montagem',false,true)}</div>`;if(S.state==='awaiting_decision')next=`<div class="alert"><strong>Limite de custo atingido</strong><p>${S.issue}</p>${button('resume','Retomar novos jobs',true)}<p class="small">Indisponível: orçamento sem margem para a etapa. A interface não aumenta o teto por conta própria.</p>${link('configuracoes','Consultar política de limites')}<p>Alternativa só poderá ser executada se vier aprovada e elegível do domínio.</p></div>`;if(S.state==='producing'||S.state==='preparing')next=`<p>Etapa: ${S.state==='preparing'?'Preparação':'Montagem de demonstração'}. Sem percentual global ou prazo confiável.</p>${button('ready','Simular versão pronta para revisão',false,true)}`;if(S.state==='correcting')next=`<p>Executando somente o plano de correção aceito na simulação.</p>${button('finish-correction','Simular conclusão da correção',false,true)}`;if(S.state==='ready_for_review')next=`<p>Versão ${S.renderVersion} disponível apenas como representação visual.</p>${link('revisao','Abrir revisão',true)}`;if(S.state==='paused')next=`<div class="alert">Novos jobs pausados. Trabalhos já enviados podem continuar e gerar custos.</div>${button('resume','Simular retomada',false,true)}`;if(S.state==='cancelled')next='<div class="alert">Novos jobs cancelados. Jobs externos já iniciados exigem reconciliação; arquivos e custos anteriores permanecem no histórico.</div>';if(S.state==='approved'||S.state==='exported')next=link('entrega','Abrir entrega',true);html=head('Acompanhamento','Fechar esta tela não cancelaria a execução real em background.')+source()+status()+`<ol class="steps"><li>Preparação</li><li>Roteiro e direção</li><li>Geração</li><li class="current">${S.state==='ready_for_review'?'Revisão':'Etapa do cenário'}</li><li>Entrega</li></ol><section class="card">${next}<div class="actions">${button('pause','Pausar novos jobs · simulação',!['producing','preparing','correcting'].includes(S.state))}${button('cancel','Cancelar novos jobs · simulação',['cancelled','approved','exported'].includes(S.state))}</div></section>${costs()}<details><summary>Inspeção da produção · opcional</summary><p>Roteiro, fontes, referências e avaliações serão recebidos do dossiê. A aprovação de cada job é separada da decisão humana.</p><p>Em timeout desconhecido, consultar execução externa antes de repetir; esta fixture de falha representa resultado conhecido.</p></details>`;}
if(route==='revisao'){const allowed=['ready_for_review','approved','exported'].includes(S.state);html=head('Revisão do vídeo','Aprovação se aplica à versão renderizada que você revisou.')+(allowed?`<div class="grid"><section class="card"><h2>Versão ${S.renderVersion} · render-demo-01</h2><div class="preview"><strong>Área do player · desenho</strong><p>Nenhum vídeo ou áudio real disponível</p><span>Timecodes abaixo são fictícios</span></div><p class="small">Fonte fixada: artigo-demo-01 · revisão ${S.productionArticleVersion||S.articleVersion}. Aprovação desta versão: ${S.approvalVersion===S.renderVersion?'simulada':'nenhuma'}.</p>${S.correctionDone?'<div class="alert">Correção concluída no desenho. A versão nova exige revisão integral; a anterior permanece no histórico.</div>':''}</section><section class="card"><h2>Cenas e transcrição · exemplo</h2><div class="scene"><strong>Plano-demo-01 · 00:00–00:10</strong><p>“Observo como as notificações interrompem minha atenção.”</p></div><div class="scene"><strong>Plano-demo-02 · 00:10–00:20</strong><p>“Escolho um momento para fazer uma pausa.”</p>${link('correcao','Apontar problema neste trecho')}</div><details><summary>Intenção e referências</summary><p>Referências e fontes versionadas aparecerão aqui. Nenhuma imagem ilustrativa representa um registro real.</p></details></section></div><section class="card"><h2>Aprovar versão ${S.renderVersion}</h2><label class="check"><input id="reviewed" type="checkbox">Declaro que revisei integralmente esta versão (somente simulação).</label><p class="small">Não há pendência obrigatória nesta fixture. Reproduzir um player não substituirá essa declaração na aplicação real.</p>${button('approve','Simular aprovação desta versão',true,true)}</section>`:`<div class="alert">A produção não tem versão disponível para revisão neste estado.</div>${link('producao','Voltar ao acompanhamento')}`);}
if(route==='correcao'){const allowed=['ready_for_review','approved','exported'].includes(S.state);html=head('Correção localizada','Relate o problema no contexto. O sistema propõe o que precisa refazer.')+(allowed?`<section class="card"><p><strong>Render-demo-01 · versão ${S.renderVersion} · plano-demo-02 · 00:10–00:20</strong></p><label for="category">Problema</label><select id="category"><option>Imagem não corresponde</option><option>Personagem diferente</option><option>Ambiente inadequado</option><option>Movimento estranho</option><option>Problema na fala/voz</option><option>Outro</option></select><label for="comment">Comentário ou nova fala</label><textarea id="comment" placeholder="Descreva o ajuste necessário neste trecho."></textarea><div class="actions">${button('propose','Simular plano de correção',false,true)}${link('revisao','Voltar à revisão')}</div></section>`+(S.pendingCorrection?`<section class="card"><h2>Proposta de correção · fictícia</h2><p>Alvo: versão ${S.renderVersion}, plano-demo-02. Categoria: ${escapeHtml(S.category)}.</p><p>Comentário: ${escapeHtml(S.comment||'Sem comentário adicional.')}</p><p>Refazer: ${S.speech?'fala, áudio, lip sync, legendas, tempos e montagem':'imagem, clipe e montagem afetada'}.</p><p>Preservar: ${S.speech?'componentes visuais independentes, sujeito à validação temporal':'roteiro, áudio e legendas válidos conforme plano'}.</p>${S.speech?'<div class="alert">Fala alterada exige fidelidade à fonte e revalidação dos derivados. Este desenho representa o plano após essas verificações; não as executa.</div>':''}<p>Custo adicional estimado: ${money(700)} · fictício, não garantido.</p><p>Na simulação, a proposta é elegível. O domínio verifica margem e limites antes de cada job pago.</p><p>Executar cria a versão ${S.renderVersion+1} e exige nova revisão. A aprovação anterior não será herdada.</p>${button('execute','Executar correção · simulação',false,true)}</section>`:''):`<div class="alert">Não há renderização revisável neste estado.</div>${link('producao','Abrir acompanhamento')}`);}
if(route==='entrega'){const valid=S.approvalVersion===S.renderVersion&&['approved','exported'].includes(S.state);html=head('Entrega','Disponibilize a versão aprovada, com arquivos e legenda identificados.')+(valid?`<section class="card"><h2>Versão ${S.renderVersion} · aprovação simulada</h2><p>Formato e arquivos reais dependem do perfil de entrega e da verificação de integridade.</p><div class="preview">Vídeo e legenda ausentes neste protótipo</div><div class="actions">${button('download','Exportar recibo fictício do cenário',false,true)}${button('media','Baixar vídeo/legendas reais',true)}</div><p class="small">Exportação do recibo não é entrega audiovisual. Nenhum arquivo de mídia é simulado como pronto.</p></section>${costs()}${link('artigos','Criar nova produção do artigo')}`:`<div class="alert"><strong>Exportação aprovada indisponível</strong><p>Esta versão precisa de aprovação correspondente e arquivos íntegros. Preview de revisão não é entrega aprovada.</p></div>${link('revisao','Abrir revisão')}`);}
if(route==='perfis')html=head('Perfis de produção','Configurar uma vez; reutilizar em vários artigos.')+`<section class="card"><h2>${F.profile.name}</h2><p>Revisão 1 · ${F.profile.character}</p><p>${F.profile.notice}</p><p>Rascunho → em calibração → validado → suspenso. Validação tem escopo de receita, formato e conteúdo.</p><p>Editor e testes serão conectados em S1; nenhuma voz ou referência foi validada por este desenho.</p></section>`;
if(route==='universo')html=head('Universo','Identidade e repertório visual versionados.')+`<section class="card"><h2>Personagens · ambientes · figurinos e objetos · estilos · vozes</h2><p>Nenhum Bible ou referência real importado neste protótipo.</p><p>O Bible original será preservado e separado da interpretação extraída. Referências antigas permanecem disponíveis às produções que as utilizaram.</p></section>`;
if(route==='configuracoes')html=head('Configurações','Fontes, conexões técnicas, armazenamento e limites.')+`<section class="card"><h2>Política de limites</h2><p>Ao faltar margem segura, parar novos gastos. Aumentar limites exige política e permissão no domínio; não há esse comando no protótipo.</p><p>Fontes, autoria, fornecedores, exportação e fuso serão configurados aqui. Conexão válida confirma acesso, sem certificar qualidade.</p><p>Sem credenciais ou integração externa.</p></section>${link('producao','Voltar à produção')}`;
if(route==='revisao'&&S.versionHistory?.length)html+=`<details><summary>Histórico de versões · simulação</summary>${S.versionHistory.map(v=>`<p>Versão ${v.version}: ${v.approved?'aprovação simulada preservada no histórico':'sem aprovação'}. A versão ativa não herda essa decisão.</p>`).join('')}</details>`;
document.getElementById('content').innerHTML=html+`<footer>UX 0.1 · fixtures locais · sem persistência, integração ou mídia real. Este desenho não libera o MVP.</footer>`;document.title=`FBR Videos · ${route} · protótipo`;
document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>act(el.dataset.action)));const check=document.getElementById('reviewed');if(check)check.addEventListener('change',()=>{document.querySelector('[data-action="approve"]').disabled=!check.checked;});document.getElementById('content').focus({preventScroll:true});}
function act(id){switch(id){case'create':if(!S.incomplete)go('criar');break;case'save-source':{const v=document.getElementById('sourceText').value.trim();if(!v){announce('Inclua texto para demonstrar a nova revisão. A completude real será validada pela base técnica.');return;}S.sourceText=v;S.incomplete=false;S.articleVersion++;announce('Nova revisão salva na memória da demonstração. Sem validação real de completude.');render();break;}case'generate':if(S.incomplete||S.scenario==='limite')return;S.versionHistory=[];S.created=true;S.productionArticleVersion=S.articleVersion;S.state='producing';S.renderVersion=1;S.approvalVersion=null;S.pendingCorrection=false;S.correctionDone=false;announce('Produção simulada criada com artigo e perfil; nenhum job enviado.');go('producao');break;case'ready':S.state='ready_for_review';announce('Renderização representada como pronta; nenhum vídeo real gerado.');render();break;case'retry':S.state='producing';S.issue='';announce('Simulação retoma somente montagem, preservando componentes válidos.');render();break;case'pause':S.resumeState=S.state;S.state='paused';announce('Novos jobs pausados na simulação. Externos iniciados poderiam continuar.');render();break;case'resume':if(S.scenario==='limite')return;S.state=S.resumeState||'producing';announce('Retomada simulada; a aplicação real reconciliará jobs antes de repetir.');render();break;case'cancel':S.state='cancelled';announce('Cancelamento simulado; custos e arquivos anteriores seriam preservados.');render();break;case'propose':S.category=document.getElementById('category').value;S.comment=document.getElementById('comment').value;S.speech=S.category==='Problema na fala/voz';S.pendingCorrection=true;announce('Plano fictício apresentado para avaliação antes da execução.');render();break;case'execute':S.versionHistory=[...(S.versionHistory||[]),{version:S.renderVersion,approved:S.approvalVersion===S.renderVersion}];S.state='correcting';S.approvalVersion=null;S.pendingCorrection=false;announce('Correção simulada iniciada. Nenhum gasto ou integração.');go('producao');break;case'finish-correction':S.renderVersion++;S.state='ready_for_review';S.correctionDone=true;announce('Nova versão simulada pronta; requer nova revisão e aprovação.');go('revisao');break;case'approve':if(!document.getElementById('reviewed').checked)return;S.approvalVersion=S.renderVersion;S.state='approved';announce('Aprovação registrada somente na memória do protótipo para a versão exibida.');go('entrega');break;case'download':{if(S.approvalVersion!==S.renderVersion)return;const text=`FBR Videos — RECIBO FICTÍCIO DE UX\nSem vídeo, legenda, gasto ou aprovação humana real.\nRender-demo-01 versão ${S.renderVersion}\nArtigo-demo-01 revisão ${S.productionArticleVersion||S.articleVersion}\nCenário ${S.scenario}\n`;const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='fbr-videos-recibo-ficticio-ux.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);S.state='exported';announce('Recibo fictício exportado. Arquivos audiovisuais reais continuam indisponíveis.');render();break;}}}
document.getElementById('scenario').innerHTML=F.scenarios.map(c=>`<option value="${c.id}">${c.label}</option>`).join('');document.getElementById('scenario').addEventListener('change',e=>reset(e.target.value));document.getElementById('reset').addEventListener('click',()=>reset(document.getElementById('scenario').value));window.addEventListener('hashchange',render);reset('sucesso');
</script>
